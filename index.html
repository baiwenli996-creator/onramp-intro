<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Hello, World!</h1>
   
    <form action="https://httpbin.org/post" method="post">
        <div>
            <label for="name">name:</label>
            <input type="text" id="name" name="name" placeholder="example: Last, First name">
        </div>
        <br><br>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example: lsi034@gmail.com">
            
        </div>
        <br><br>
        <div>
        <label for="area">Leave Your Message:</label>
        <br><br>
        <textarea name="area" id="area" cols="30" rows="10"></textarea>
        </div>
        <br><br>
        <div>
        <table>
            <tr>
                <th>Item</th>
                <th>Quantity<br>input</th>
            </tr>
            <tr>
                <td>Apples</td>
                <td><input type="number" name="apples" id="apples" min="0" max="100" value="0"></td>
            </tr>
            <tr>
                <td>Bananas</td>
                <td><input type="number" name="bananas" id="bananas" min="0" max="100" value="0"></td>
            </tr>
            <tr>
                <td>Cherries</td>
                <td><input type="number" name="cherries" id="cherries" min="0" max="100" value="0"></td>
            </tr>
        </table>
        </div>
        <br><br>
      <button type="submit">submit</button>
  </form>

  
</body>
</html>
